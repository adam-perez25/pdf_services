<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Numerar páginas y marca de agua | PDF Toolkit</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="shell service-page">
        <section class="intro">
            <p class="eyebrow">SERVICIO 10 / NUMERAR Y MARCA DE AGUA</p>
            <h1>Numera páginas<br><em>o marca tus PDFs.</em></h1>
            <p class="lede">Añade el número de página o un texto de marca de agua a todas las páginas del documento.</p>
        </section>

        <nav class="service-back" aria-label="Navegación del servicio">
            <a class="back-button" href="/">&#8592; Menu</a>
        </nav>

        <section class="workspace" aria-labelledby="stamp-title">
            <div class="view-heading">
                <h2 id="stamp-title">Documento PDF</h2>
                <p class="view-lede">El texto se coloca derecho aunque las páginas estén giradas. El contenido original no se modifica.</p>
            </div>

            <form id="stamp-form">
                <label class="dropzone" for="stamp-input" id="stamp-dropzone">
                    <span class="drop-icon">+</span>
                    <span><strong>Seleccionar PDF</strong><small id="stamp-file-name">o arrástralo aquí</small></span>
                    <input id="stamp-input" type="file" accept="application/pdf,.pdf">
                </label>

                <label class="name-field">
                    <span>Qué añadir</span>
                    <select id="stamp-mode">
                        <option value="numbers" selected>Números de página</option>
                        <option value="watermark">Marca de agua de texto</option>
                    </select>
                </label>

                <div id="stamp-numbers-options">
                    <label class="name-field">
                        <span>Posición</span>
                        <select id="stamp-position">
                            <option value="bottom-center" selected>Abajo, centrado</option>
                            <option value="bottom-right">Abajo, a la derecha</option>
                            <option value="bottom-left">Abajo, a la izquierda</option>
                            <option value="top-center">Arriba, centrado</option>
                            <option value="top-right">Arriba, a la derecha</option>
                            <option value="top-left">Arriba, a la izquierda</option>
                        </select>
                    </label>
                    <label class="name-field">
                        <span>Formato</span>
                        <select id="stamp-number-format">
                            <option value="n" selected>1</option>
                            <option value="n-of-total">1 / N</option>
                            <option value="page-n-of-total">Página 1 de N</option>
                        </select>
                    </label>
                    <label class="name-field">
                        <span>Empezar a numerar en</span>
                        <input id="stamp-start-number" type="number" value="1" min="0" max="100000" step="1">
                    </label>
                    <label class="name-field">
                        <span>Tamaño de letra (6-72 pt)</span>
                        <input id="stamp-number-size" type="number" value="12" min="6" max="72" step="1">
                    </label>
                </div>

                <div id="stamp-watermark-options" hidden>
                    <label class="name-field">
                        <span>Texto de la marca de agua</span>
                        <input id="stamp-text" type="text" placeholder="Ejemplo: BORRADOR" maxlength="100" autocomplete="off">
                    </label>
                    <label class="name-field">
                        <span>Tamaño de letra (8-200 pt; se reduce si no cabe)</span>
                        <input id="stamp-watermark-size" type="number" value="60" min="8" max="200" step="1">
                    </label>
                    <label class="name-field">
                        <span>Opacidad (0,1-1)</span>
                        <input id="stamp-opacity" type="number" value="0.3" min="0.1" max="1" step="0.1">
                    </label>
                    <label class="name-field">
                        <span>Orientación</span>
                        <select id="stamp-rotation">
                            <option value="45" selected>Diagonal (45°)</option>
                            <option value="0">Horizontal</option>
                        </select>
                    </label>
                </div>

                <label class="name-field">
                    <span>Nombre del PDF</span>
                    <input id="stamp-output-name" type="text" value="numerado.pdf" maxlength="120" autocomplete="off">
                </label>
                <button class="primary-button" type="submit">
                    <span>Aplicar y descargar</span>
                    <span aria-hidden="true">&#8594;</span>
                </button>
            </form>
            <p id="stamp-status" class="status" role="status"></p>
        </section>
    </main>
    <script src="/static/common.js"></script>
    <script src="/static/stamp.js"></script>
</body>
</html>
