<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Unir PDF | PDF Toolkit</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="tool-page">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div class="app-layout">
    <nav id="side-nav" class="side-nav" aria-label="Herramientas">
        <a class="back-button" href="/">&#8592; Menú</a>
    </nav>
    <main class="shell service-page" id="main">
        <section class="intro">
            <p class="eyebrow">Unir y organizar</p>
            <h1>Une tus documentos<br><em>en el orden correcto.</em></h1>
            <p class="lede">Selecciona tus archivos, ordénalos y descarga un único PDF.</p>
        </section>

        <section class="workspace" aria-labelledby="files-title">
            <ol class="steps" aria-label="Pasos">
                <li class="step" aria-current="step"><span class="step-number">1</span>Elige los archivos</li>
                <li class="step"><span class="step-number">2</span>Ordena</li>
                <li class="step"><span class="step-number">3</span>Descarga</li>
            </ol>

            <form class="tool-layout" id="merge-form">
                <div class="tool-files">
                    <div class="section-heading">
                        <h2 id="files-title">Tu selección</h2>
                        <span id="file-count" class="counter">0 archivos</span>
                    </div>

                    <label class="dropzone" for="file-input" id="dropzone">
                        <span class="drop-icon">+</span>
                        <span><strong>Seleccionar PDFs</strong><small>o arrástralos aquí</small></span>
                        <input id="file-input" type="file" accept="application/pdf,.pdf" multiple>
                    </label>

                    <div id="empty-state" class="empty-state">Todavía no has seleccionado ningún archivo.</div>
                    <ol id="file-list" class="file-list"></ol>
                </div>
                <div class="tool-options">
                    <label class="name-field">
                        <span>Nombre del PDF</span>
                        <input id="output-name" type="text" value="merged.pdf" maxlength="120" autocomplete="off">
                    </label>
                    <div class="action-bar">
                        <button class="primary-button" type="submit">
                            <span>Unir y descargar</span>
                            <span aria-hidden="true">&#8594;</span>
                        </button>
                        <p id="status" class="status" role="status"></p>
                    </div>
                </div>
            </form>
        </section>
    </main>
    </div>
    <script src="/static/tools.js"></script>
    <script src="/static/common.js"></script>
    <script src="/static/merge.js"></script>
</body>
</html>
