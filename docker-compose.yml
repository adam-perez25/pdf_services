services:
  unir-pdf:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    # The biggest jobs (protecting or merging files of several hundred MB) use
    # about 2-3 times the file size in memory; 3 GB leaves room for that plus
    # LibreOffice or Ghostscript. Raise it together with MAX_UPLOAD_MB.
    mem_limit: 3g
    # Limits and timeouts (these are the defaults; edit and run
    # `docker compose up -d` to apply). See "Configuración" in the README.
    environment:
      MAX_UPLOAD_MB: "500"
      # Must be at least MAX_UPLOAD_MB, or the service will not start.
      MAX_TOTAL_UPLOAD_MB: "1000"
      OFFICE_TIMEOUT_SECONDS: "300"
      COMPRESSION_TIMEOUT_SECONDS: "600"
      COMPRESSION_SECONDS_PER_PAGE: "2"
      COMPRESSION_MAX_TIMEOUT_SECONDS: "3600"
      DOCUMENT_TTL_SECONDS: "1800"
      DOCUMENT_SWEEP_SECONDS: "300"
      OCR_MAX_PAGES: "2000"
      OCR_TIMEOUT_SECONDS: "60"
      OCR_SECONDS_PER_PAGE: "20"
      OCR_MAX_TIMEOUT_SECONDS: "14400"
