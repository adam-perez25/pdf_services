<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Excel a PDF | PDF Toolkit</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="tool-page">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div class="app-layout">
    <nav id="side-nav" class="side-nav" aria-label="Herramientas">
        <a class="back-button" href="/">&#8592; Menú</a>
    </nav>
    <main class="shell service-page" id="main">
        <section class="intro">
            <p class="eyebrow">Convertir a PDF</p>
            <h1>Convierte Excel<br><em>en un PDF.</em></h1>
            <p class="lede">Sube una hoja de cálculo XLS o XLSX y descarga su versión en PDF.</p>
        </section>

        <section class="workspace" aria-labelledby="office-title">
            <div class="view-heading">
                <h2 id="office-title">Hoja de cálculo Excel</h2>
                <p class="view-lede">Todas las hojas del libro se convierten mediante LibreOffice.</p>
            </div>

            <ol class="steps" aria-label="Pasos">
                <li class="step" aria-current="step"><span class="step-number">1</span>Elige el archivo</li>
                <li class="step"><span class="step-number">2</span>Ajusta</li>
                <li class="step"><span class="step-number">3</span>Descarga</li>
            </ol>

            <form class="tool-layout" id="office-form" data-endpoint="/api/excel-to-pdf" data-extensions="xls,xlsx" data-default-name="hoja-de-calculo.pdf" data-missing-file="Selecciona una hoja de cálculo Excel.">
                <div class="tool-files">
                    <label class="dropzone" for="office-input" id="office-dropzone">
                        <span class="drop-icon">+</span>
                        <span><strong>Seleccionar hoja de cálculo</strong><small id="office-file-name">o arrástrala aquí</small></span>
                        <input id="office-input" type="file" accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
                    </label>
                </div>
                <div class="tool-options">
                    <label class="name-field">
                        <span>Nombre del PDF</span>
                        <input id="office-output-name" type="text" value="hoja-de-calculo.pdf" maxlength="120" autocomplete="off">
                    </label>
                    <div class="action-bar">
                        <button class="primary-button" type="submit">
                            <span>Convertir y descargar PDF</span>
                            <span aria-hidden="true">&#8594;</span>
                        </button>
                        <p id="office-status" class="status" role="status"></p>
                    </div>
                </div>
            </form>
        </section>
    </main>
    </div>
    <script src="/static/tools.js"></script>
    <script src="/static/common.js"></script>
    <script src="/static/office.js"></script>
</body>
</html>
