<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF Toolkit</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="shell">
        <section class="intro">
            <p class="eyebrow">PDF TOOLKIT</p>
            <h1>Herramientas para<br><em>tus PDFs.</em></h1>
            <p class="lede">Elige una función para empezar a trabajar con tus documentos.</p>
        </section>

        <section class="service-menu" aria-labelledby="services-title">
            <p class="eyebrow">SERVICIOS</p>
            <h2 id="services-title">¿Qué quieres hacer?</h2>
            <div class="service-grid">
                <a class="service-card" href="/merge">
                    <span class="service-index">01</span>
                    <span class="service-copy">
                        <strong>Unir PDF</strong>
                        <small>Combina varios documentos en uno.</small>
                    </span>
                    <span class="service-arrow" aria-hidden="true">&#8594;</span>
                </a>
                <a class="service-card" href="/split">
                    <span class="service-index">02</span>
                    <span class="service-copy">
                        <strong>Dividir PDF</strong>
                        <small>Separa un documento en varios archivos.</small>
                    </span>
                    <span class="service-arrow" aria-hidden="true">&#8594;</span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
