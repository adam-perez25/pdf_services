services:
  unir-pdf:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    # The biggest jobs (protecting or merging files of several hundred MB) use
    # about 2-3 times the file size in memory; 3 GB leaves room for that plus
    # LibreOffice or Ghostscript. Raise it together with MAX_UPLOAD_MB.
    mem_limit: 3g
    # A tiny init as PID 1 reaps the zombie processes left by killed
    # LibreOffice / Ghostscript / Tesseract children.
    init: true
    # The service needs no Linux capabilities and never gains privileges
    # (it runs as an unprivileged user); pids_limit stops a fork storm while
    # leaving room for LibreOffice and the OCR workers.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    # Limits and timeouts (these are the defaults; edit and run
    # `docker compose up -d` to apply). See "Configuración" in the README.
    environment:
      MAX_UPLOAD_MB: "500"
      # Must be at least MAX_UPLOAD_MB, or the service will not start.
      MAX_TOTAL_UPLOAD_MB: "1000"
      OFFICE_TIMEOUT_SECONDS: "300"
      COMPRESSION_TIMEOUT_SECONDS: "600"
      COMPRESSION_SECONDS_PER_PAGE: "2"
      COMPRESSION_MAX_TIMEOUT_SECONDS: "3600"
      DOCUMENT_TTL_SECONDS: "1800"
      DOCUMENT_SWEEP_SECONDS: "300"
      OCR_MAX_PAGES: "2000"
      OCR_TIMEOUT_SECONDS: "60"
      OCR_SECONDS_PER_PAGE: "20"
      OCR_MAX_TIMEOUT_SECONDS: "14400"
      # Memory budget shared by big jobs (~1 GB of mem_limit left for the rest);
      # raise it together with mem_limit.
      HEAVY_JOB_BUDGET_MB: "2000"
      HEAVY_JOB_WAIT_SECONDS: "300"
      HEAVY_JOB_MAX_WAITING: "10"
      # PDF to images: total pixel cap (10000 Mpx = 1000 A4 pages at 300 dpi),
      # free temp disk kept after the estimated output, and time limit.
      PDF_TO_IMAGES_MAX_MEGAPIXELS: "10000"
      PDF_TO_IMAGES_MIN_FREE_MB: "512"
      PDF_TO_IMAGES_TIMEOUT_SECONDS: "300"
      PDF_TO_IMAGES_SECONDS_PER_PAGE: "3"
      PDF_TO_IMAGES_MAX_TIMEOUT_SECONDS: "7200"
