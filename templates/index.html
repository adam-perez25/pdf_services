<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>PDF Toolkit</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="home-page">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <main class="shell home-shell" id="main">
        <section class="intro">
            <p class="eyebrow">PDF Toolkit</p>
            <h1>Herramientas para<br><em>tus PDFs.</em></h1>
            <p class="lede">Elige una herramienta. Los archivos se procesan en este servidor y no se guardan.</p>
        </section>

        <div class="tool-search" role="search" hidden>
            <label class="tool-search-label" for="tool-search">Buscar herramienta</label>
            <div class="tool-search-box">
                <input id="tool-search" type="search" placeholder="Por ejemplo: comprimir, firma, Word" autocomplete="off" aria-describedby="tool-search-hint">
                <kbd class="tool-search-key" id="tool-search-hint" aria-label="Pulsa la barra para buscar">/</kbd>
            </div>
        </div>
        <p id="tool-search-empty" class="tool-search-empty" role="status" hidden>No hay ninguna herramienta con ese nombre.</p>

        <div id="tool-groups" class="tool-groups"></div>

        <noscript>
            <ul class="tool-fallback">
                <li><a href="/merge">Unir PDF</a></li>
                <li><a href="/split">Dividir PDF</a></li>
                <li><a href="/pages">Organizar páginas</a></li>
                <li><a href="/stamp">Numerar y marca de agua</a></li>
                <li><a href="/images">Imágenes a PDF</a></li>
                <li><a href="/word">Word a PDF</a></li>
                <li><a href="/excel">Excel a PDF</a></li>
                <li><a href="/powerpoint">PowerPoint a PDF</a></li>
                <li><a href="/compress">Comprimir PDF</a></li>
                <li><a href="/pdfa">PDF/A y reparar</a></li>
                <li><a href="/protect">Proteger PDF</a></li>
                <li><a href="/sign">Firmar PDF</a></li>
                <li><a href="/metadata">Editar metadatos</a></li>
                <li><a href="/ocr">OCR: hacer buscable un escaneo</a></li>
                <li><a href="/extract-text">Extraer texto</a></li>
                <li><a href="/pdf-to-images">PDF a imágenes</a></li>
                <li><a href="/workflow">Flujo de trabajo</a></li>
            </ul>
        </noscript>
    </main>
    <script src="/static/tools.js"></script>
</body>
</html>
