<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Word a PDF | PDF Toolkit</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="tool-page">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div class="app-layout">
    <nav id="side-nav" class="side-nav" aria-label="Herramientas">
        <a class="back-button" href="/">&#8592; Menú</a>
    </nav>
    <main class="shell service-page" id="main">
        <section class="intro">
            <p class="eyebrow">Convertir a PDF</p>
            <h1>Convierte Word<br><em>en un PDF.</em></h1>
            <p class="lede">Sube un documento DOC o DOCX y descarga su versión en PDF.</p>
        </section>

        <section class="workspace" aria-labelledby="office-title">
            <div class="view-heading">
                <h2 id="office-title">Documento Word</h2>
                <p class="view-lede">La conversión conserva el formato mediante LibreOffice.</p>
            </div>

            <form id="office-form" data-endpoint="/api/word-to-pdf" data-extensions="doc,docx" data-default-name="documento.pdf" data-missing-file="Selecciona un documento Word.">
                <label class="dropzone" for="office-input" id="office-dropzone">
                    <span class="drop-icon">+</span>
                    <span><strong>Seleccionar documento</strong><small id="office-file-name">o arrástralo aquí</small></span>
                    <input id="office-input" type="file" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                </label>

                <label class="name-field">
                    <span>Nombre del PDF</span>
                    <input id="office-output-name" type="text" value="documento.pdf" maxlength="120" autocomplete="off">
                </label>
                <button class="primary-button" type="submit">
                    <span>Convertir y descargar PDF</span>
                    <span aria-hidden="true">&#8594;</span>
                </button>
            </form>
            <p id="office-status" class="status" role="status"></p>
        </section>
    </main>
    </div>
    <script src="/static/tools.js"></script>
    <script src="/static/common.js"></script>
    <script src="/static/office.js"></script>
</body>
</html>
